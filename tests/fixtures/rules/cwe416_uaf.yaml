# Test fixture for the gate: a known-good CWE-416 (Use After Free) rule, used
# only to check that the gate grades hits, false positives and invalid rules
# correctly. Written with an AI assistant (Claude) while building the gate,
# tuned on the whole Juliet CWE-416 set - it is NOT part of the rule
# generation pipeline, NOT a few-shot example for the generator and NOT a
# baseline for the thesis results (rules are generated by the local models).
#
# Taint mode instead of plain `free($P); ... use($P)` patterns: plain
# sequences don't cross block boundaries, so they miss every Juliet flow
# variant where the free and the use sit in different if/switch/loop blocks.
# Taint mode follows the intraprocedural control flow graph.
#
# Known limitation (Semgrep OSS is intraprocedural): when the freed pointer is
# only used inside another function (Juliet 63/64 variants, where `&data` is
# passed to a sink in a separate file), nothing is reported.
rules:
  - id: fixture-cwe416-use-after-free
    languages: [c]
    severity: ERROR
    message: "Pointer is read, dereferenced or returned after being freed (CWE-416)"
    metadata:
      cwe: "CWE-416"
      source: test-fixture
    mode: taint
    pattern-sources:
      # After free(p), p itself carries the taint.
      - by-side-effect: true
        patterns:
          - pattern: free($P)
          - focus-metavariable: $P
    pattern-sanitizers:
      # Reassigning the pointer (new allocation, NULL, another address) ends the freed state.
      - by-side-effect: true
        patterns:
          - pattern: $P = $E
          - focus-metavariable: $P
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $X[$I]
              - pattern: "*$X"
              - pattern: $X->$FLD
              - pattern: return $X;
              - patterns:
                  - pattern: $F(..., $X, ...)
                  # A second free is CWE-415, not a use.
                  - pattern-not: free(...)
                  # Passing the pointer's address doesn't touch the freed memory.
                  - metavariable-pattern:
                      metavariable: $X
                      patterns:
                        - pattern-not: "&$Y"
          - focus-metavariable: $X
