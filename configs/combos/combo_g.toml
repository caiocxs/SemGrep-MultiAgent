# Combo G - "remote generator and corrector" (Groq, free tier; model from GROQ_MODEL in .env).
# Same loop as combo D; the generator and the corrector call an API instead of a local GGUF. It is a separate arm of the study
# (a 120B hosted model is not a small local one, principle 1) and measures how the rate limits shape the run. The
# provider, model and keys are read from .env; the detector is not used by the synthesis, and the critic and merger are
# off by default (the same provider is set so the combo loads).

name = "G"
description = "Groq (GROQ_MODEL) generates and corrects over the API, rate limited; the other roles are unused"
target_gpu = "none (remote)"

[defaults]
temperature = 0.0
provider = "groq"
min_interval = 2.5        # seconds between calls; raise it if the free tier answers 429 often
reasoning_effort = "low"  # gpt-oss reasons before answering; "low" keeps the answer inside max_tokens
max_tokens = 4096

[loop]
max_fix_attempts = 3

[roles.detector]

[roles.generator]

[roles.corrector]
temperature = 0.2

[roles.critic]

[roles.merger]
